<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>旋涡背景编辑器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      :root{
        color-scheme: dark;
        --bg:#0c0914;
        --panel:#150f22;
        --panel-2:#1b142e;
        --gold:#d9a441;
        --gold-soft:rgba(217,164,65,.38);
        --gold-faint:rgba(217,164,65,.16);
        --ink:#efe7d7;
        --muted:#a79bc0;
        --line:rgba(217,164,65,.22);
        --field:#0d0a18;
        --danger:#ff8a7a;
      }
      *{box-sizing:border-box}
      html,body{height:100%}
      body{
        margin:0;background:var(--bg);color:var(--ink);
        font-family:"Noto Serif SC","Songti SC",serif;
        overflow:hidden;
      }
      button,select,input,textarea{font-family:inherit}
      button,[role="button"],select,input:not([type="checkbox"],[type="radio"]){min-height:2.25rem}

      /* ---------- stage ---------- */
      #stage{position:fixed;inset:0}
      #stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
      #swCanvas{image-rendering:pixelated}
      .hidden-canvas{display:none !important}

      /* ---------- status bar ---------- */
      #status{
        position:fixed;left:12px;bottom:12px;z-index:30;
        display:flex;align-items:center;gap:8px;
        background:rgba(12,9,20,.82);border:1px solid var(--line);
        padding:7px 12px;border-radius:3px;
        font-size:12px;letter-spacing:.04em;color:var(--muted);
        backdrop-filter:blur(4px);max-width:min(92vw,560px);
      }
      #status .dot{width:8px;height:8px;border-radius:50%;background:#7ee2a0;flex:none;box-shadow:0 0 8px rgba(126,226,160,.8)}
      #status.warn .dot{background:var(--gold);box-shadow:0 0 8px rgba(217,164,65,.8)}
      #status b{color:var(--ink);font-weight:700}
      #status .fps{color:var(--gold);font-variant-numeric:tabular-nums}

      /* ---------- panel toggle ---------- */
      #panelToggle{
        position:fixed;top:14px;right:14px;z-index:40;
        display:none;align-items:center;gap:8px;
        background:rgba(21,15,34,.92);color:var(--gold);
        border:1px solid var(--gold-soft);border-radius:3px;
        padding:9px 14px;cursor:pointer;font-size:13px;letter-spacing:.08em;
      }
      #panelToggle:hover{background:var(--panel-2)}
      #panelToggle.show{display:flex}
      #panelToggle svg{width:16px;height:16px;flex:none}

      /* ---------- control panel ---------- */
      #panel{
        position:fixed;top:0;right:0;bottom:0;width:308px;z-index:35;
        background:linear-gradient(168deg,#1a1230 0%,var(--panel) 46%,#0e0a1a 100%);
        border-left:1px solid var(--gold-soft);
        box-shadow:-18px 0 44px rgba(0,0,0,.55);
        overflow-y:auto;overflow-x:hidden;
        padding:20px 18px 26px;
        transition:transform .32s ease;
        scrollbar-width:thin;scrollbar-color:var(--gold-soft) transparent;
      }
      #panel.hidden{transform:translateX(105%)}
      #panel::-webkit-scrollbar{width:6px}
      #panel::-webkit-scrollbar-thumb{background:var(--gold-soft);border-radius:3px}

      .p-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
      .p-head h1{
        margin:0;font-size:21px;line-height:1.25;font-weight:700;letter-spacing:.06em;
      }
      .p-head h1 .en{
        display:block;font-family:"Cinzel",serif;font-size:10.5px;font-weight:500;
        letter-spacing:.34em;color:var(--gold);margin-top:5px;text-transform:uppercase;
      }
      .p-sub{margin:9px 0 0;font-size:12px;line-height:1.7;color:var(--muted)}
      #collapseBtn{
        flex:none;background:none;border:1px solid var(--line);color:var(--muted);
        width:36px;height:36px;min-height:36px;border-radius:3px;cursor:pointer;font-size:15px;line-height:1;
      }
      #collapseBtn:hover{color:var(--gold);border-color:var(--gold-soft)}

      .rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);margin:16px 0}
      section{margin-bottom:18px}
      h2{
        margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.28em;color:var(--gold);
        display:flex;align-items:center;gap:9px;
      }
      h2::after{content:"";flex:1;height:1px;background:var(--gold-faint)}

      select{
        width:100%;background:var(--field);color:var(--ink);
        border:1px solid var(--line);border-radius:3px;
        padding:8px 10px;font-size:13.5px;cursor:pointer;
      }
      select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{
        outline:2px solid var(--gold);outline-offset:1px;
      }

      /* colors */
      .color-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
      .color-row label{flex:0 0 52px;font-size:13px;color:var(--muted)}
      .color-row input[type="color"]{
        flex:none;width:52px;height:36px;min-height:36px;padding:2px;
        background:var(--field);border:1px solid var(--line);border-radius:3px;cursor:pointer;
      }
      .color-row input[type="text"]{
        flex:1;min-width:0;background:var(--field);color:var(--ink);
        border:1px solid var(--line);border-radius:3px;padding:7px 9px;
        font-size:13px;font-variant-numeric:tabular-nums;text-transform:uppercase;
      }

      /* sliders */
      .ctl{margin-bottom:12px}
      .ctl-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
      .ctl-head label{font-size:13px;color:var(--ink)}
      .ctl-head label .unit{color:var(--muted);font-size:11px;margin-left:5px}
      .ctl-body{display:flex;align-items:center;gap:9px}
      .ctl-body input[type="range"]{
        flex:1;min-width:0;min-height:36px;accent-color:var(--gold);cursor:pointer;
        -webkit-appearance:none;appearance:none;background:transparent;height:36px;
      }
      .ctl-body input[type="range"]::-webkit-slider-runnable-track{height:4px;background:linear-gradient(90deg,var(--gold-soft),var(--gold-faint));border-radius:2px}
      .ctl-body input[type="range"]::-webkit-slider-thumb{
        -webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;
        background:var(--gold);border:2px solid #0c0914;box-shadow:0 0 0 1px var(--gold-soft);
      }
      .ctl-body input[type="range"]::-moz-range-track{height:4px;background:var(--gold-soft);border-radius:2px}
      .ctl-body input[type="range"]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid #0c0914}
      .ctl-body input[type="number"]{
        flex:0 0 66px;width:66px;background:var(--field);color:var(--gold);
        border:1px solid var(--line);border-radius:3px;padding:6px 7px;
        font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;
        -moz-appearance:textfield;appearance:textfield;
      }
      .ctl-body input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none}

      /* buttons */
      .btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
      .btn{
        background:var(--field);color:var(--ink);border:1px solid var(--line);
        border-radius:3px;padding:9px 8px;font-size:13px;letter-spacing:.05em;cursor:pointer;
        min-height:38px;
      }
      .btn:hover{border-color:var(--gold-soft);color:var(--gold)}
      .btn:active{transform:translateY(1px)}
      .btn.primary{background:linear-gradient(180deg,#2a1e08,#1d1507);border-color:var(--gold-soft);color:var(--gold)}
      .btn.primary:hover{color:#f4cd7d}
      .btn.wide{grid-column:1 / -1}

      textarea{
        width:100%;min-height:104px;resize:vertical;
        background:var(--field);color:#cfe3c2;border:1px solid var(--line);border-radius:3px;
        padding:9px 10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        font-size:11.5px;line-height:1.55;
      }
      .hint{font-size:11.5px;line-height:1.75;color:var(--muted);margin:8px 0 0}
      .hint b{color:var(--gold);font-weight:700}
      kbd{
        font-family:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;
        border-radius:3px;padding:0 5px;color:var(--ink);background:var(--field);
      }

      /* toast */
      #toast{
        position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:60;
        background:rgba(21,15,34,.95);border:1px solid var(--gold-soft);color:var(--ink);
        padding:10px 18px;border-radius:3px;font-size:13.5px;letter-spacing:.04em;
        opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;
        max-width:92vw;text-align:center;
      }
      #toast.show{opacity:1;transform:translate(-50%,0)}
      #toast.err{border-color:var(--danger);color:#ffd9d3}

      @media (max-width:560px){
        #panel{width:min(308px,92vw)}
        #status{bottom:auto;top:12px;left:12px}
      }
      @media (prefers-reduced-motion:reduce){
        #panel{transition:none}
        #toast{transition:none}
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="glCanvas"></canvas>
      <canvas id="swCanvas" class="hidden-canvas"></canvas>
    </div>

    <div id="status" role="status"><span class="dot"></span><span id="statusText">正在初始化渲染…</span><span class="fps" id="fpsText"></span></div>

    <button id="panelToggle" type="button" aria-label="打开调参面板">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2.4" fill="#150f22"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2.4" fill="#150f22"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="7" cy="17" r="2.4" fill="#150f22"/></svg>
      调参面板
    </button>

    <aside id="panel" aria-label="背景调参面板">
      <div class="p-head">
        <div>
          <h1>旋涡背景编辑器<span class="en">Vortex BG Editor</span></h1>
          <p class="p-sub">小丑牌式动态像素背景 · 自研 WebGL 着色器，调好即可导出独立 HTML 嵌进自己的游戏或网页。</p>
        </div>
        <button id="collapseBtn" type="button" aria-label="收起面板" title="收起面板 (H)">»</button>
      </div>

      <div class="rule"></div>

      <section>
        <h2>运动模式</h2>
        <select id="modeSel" aria-label="运动模式"></select>
      </section>

      <section>
        <h2>预设</h2>
        <select id="presetSel" aria-label="预设">
          <option value="">— 选择预设 —</option>
        </select>
      </section>

      <section>
        <h2>配色</h2>
        <div class="color-row">
          <label for="c1">主色</label>
          <input type="color" id="c1" />
          <input type="text" id="c1hex" spellcheck="false" aria-label="主色十六进制值" />
        </div>
        <div class="color-row">
          <label for="c2">亮色</label>
          <input type="color" id="c2" />
          <input type="text" id="c2hex" spellcheck="false" aria-label="亮色十六进制值" />
        </div>
        <div class="color-row">
          <label for="c3">暗色</label>
          <input type="color" id="c3" />
          <input type="text" id="c3hex" spellcheck="false" aria-label="暗色十六进制值" />
        </div>
      </section>

      <section>
        <h2>参数</h2>
        <div id="sliders"></div>
      </section>

      <section>
        <h2>操作</h2>
        <div class="btn-grid">
          <button class="btn" id="pauseBtn" type="button">暂停</button>
          <button class="btn" id="randomBtn" type="button">随机一组</button>
          <button class="btn" id="resetBtn" type="button">恢复默认</button>
          <button class="btn" id="pngBtn" type="button">导出 PNG 快照</button>
        </div>
      </section>

      <section>
        <h2>导出 / 导入</h2>
        <div class="btn-grid">
          <button class="btn" id="copyJsonBtn" type="button">复制参数 JSON</button>
          <button class="btn" id="applyJsonBtn" type="button">应用 JSON</button>
          <button class="btn primary wide" id="exportHtmlBtn" type="button">一键导出独立 HTML 背景</button>
        </div>
        <p class="hint">导出的 HTML 只有全屏背景、无编辑器面板，双击即可运行，可直接用作游戏主菜单或网页背景（MIT 开源）。</p>
        <div style="height:10px"></div>
        <textarea id="jsonBox" spellcheck="false" placeholder="参数 JSON 会出现在这里；也可以把别人分享的 JSON 粘贴进来，点「应用 JSON」。"></textarea>
      </section>

      <div class="rule"></div>
      <p class="hint"><b>快捷键</b>：<kbd>H</kbd> 显示 / 隐藏面板 · <kbd>空格</kbd> 暂停 / 继续。参数会自动记住，刷新页面后恢复上次的调法。</p>
    </aside>

    <div id="toast" role="status"></div>

    <script>
    'use strict';
    /* ================================================================
       着色器：原创实现。手法均为图形学公共技法——极坐标旋涡扭曲、
       同心涟漪、分层正弦域扭曲、角度折叠（万花筒）、对数半径隧道、
       花瓣调制玫瑰窗。预设名称与配色均为自创。MIT 开源。
       ================================================================ */
    var VERT_SRC = [
      'attribute vec2 a_pos;',
      'void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }'
    ].join('\n');

    var FRAG_SRC = [
      'precision highp float;',
      'uniform vec2  u_res;',
      'uniform float u_time;',
      'uniform int   u_mode;',
      'uniform vec3  u_c1;',
      'uniform vec3  u_c2;',
      'uniform vec3  u_c3;',
      'uniform float u_contrast;',
      'uniform float u_spin;',
      'uniform float u_scale;',
      'uniform float u_warp;',
      'uniform float u_blocks;',
      '',
      'float segFold(float a, float seg){',
      '  float w = 6.2831853 / seg;',
      '  float m = mod(a, w);',
      '  return abs(m - w * 0.5);',
      '}',
      '',
      'void main(){',
      '  float aspect = u_res.x / u_res.y;',
      '  float bw = u_blocks;',
      '  float bh = max(2.0, floor(bw / aspect));',
      '  vec2 cell = floor(gl_FragCoord.xy / u_res * vec2(bw, bh));',
      '  vec2 uv = (cell + 0.5) / vec2(bw, bh);',
      '  vec2 p = (uv - 0.5) * vec2(aspect, 1.0) * 2.0;',
      '  p *= u_scale;',
      '  float t = u_time;',
      '',
      '  /* 通用域扭曲：分层正弦扰动坐标 */',
      '  vec2 q = p;',
      '  q += u_warp * 0.16 * vec2(',
      '        sin(q.y * 2.7 + t * 0.70),',
      '        cos(q.x * 2.7 - t * 0.62));',
      '  q += u_warp * 0.07 * vec2(',
      '        sin(q.y * 6.1 - t * 1.05),',
      '        cos(q.x * 6.1 + t * 0.90));',
      '',
      '  float r = length(q);',
      '  float a = atan(q.y, q.x);',
      '  float f = 0.0;',
      '  float glow = 0.0;',
      '',
      '  if (u_mode == 0) {',
      '    /* 一·旋涡：角度随半径回收，形成旋转臂 */',
      '    f = sin(3.0 * a + u_spin * 7.0 / (r + 0.50) + 2.2 * r - 1.35 * t);',
      '    f += 0.30 * sin(7.0 * r - 2.0 * t);',
      '    f *= 0.78;',
      '  } else if (u_mode == 1) {',
      '    /* 二·涟漪：同心波纹 + 角度微扰 */',
      '    f = sin(10.0 * r - 2.1 * t + u_spin * 3.0 * sin(3.0 * a + t * 0.4));',
      '    f += 0.25 * sin(17.0 * r - 3.1 * t);',
      '    f *= 0.82;',
      '  } else if (u_mode == 2) {',
      '    /* 三·烟雾：多层正弦叠加的缓流场 + 中心呼吸微光 */',
      '    float s = sin(q.x * 1.9 + t * 0.40)',
      '            + sin(q.y * 2.4 - t * 0.31)',
      '            + sin((q.x + q.y) * 1.25 + t * 0.52)',
      '            + sin(length(q) * 3.2 - t * 0.60);',
      '    f = s * 0.25;',
      '    float breathe = 0.5 + 0.5 * sin(t * 0.9);',
      '    glow = exp(-length(p) * 2.3) * (0.08 + 0.15 * breathe);',
      '  } else if (u_mode == 3) {',
      '    /* 四·波浪：横向波列被纵向波调制 */',
      '    f = sin(q.x * 3.1 + 1.7 * sin(q.y * 2.3 + t * 0.8) + t * 1.0) * 0.72',
      '      + sin(q.y * 5.2 - t * 1.35) * 0.28;',
      '  } else if (u_mode == 4) {',
      '    /* 五·万花筒：六重角度折叠 */',
      '    float aa = segFold(a + u_spin * 1.4 / (r + 0.6), 6.0);',
      '    vec2 kp = r * vec2(cos(aa), sin(aa));',
      '    f = sin(kp.x * 6.0 - t * 1.1) * 0.60',
      '      + sin(kp.y * 8.0 + r * 4.0 - t * 1.5) * 0.40;',
      '  } else if (u_mode == 5) {',
      '    /* 六·隧道：对数半径环带向内流动 */',
      '    float lr = log(r + 0.09);',
      '    f = sin(lr * 8.5 - 2.3 * t) * 0.72',
      '      + sin(a * 5.0 + u_spin * 3.0 + lr * 3.0) * 0.28;',
      '  } else {',
      '    /* 七·玫瑰窗：八重折叠 + 花瓣半径调制 + 辐条 */',
      '    float aa = segFold(a, 8.0);',
      '    float rr = r * (0.86 + 0.26 * cos(aa * 8.0));',
      '    f = sin(rr * 10.0 - 1.25 * t + u_spin * 2.0 * cos(aa * 8.0)) * 0.62',
      '      + sin(aa * 24.0 + r * 3.0) * 0.20',
      '      + sin(r * 22.0 - 1.8 * t) * 0.18;',
      '  }',
      '',
      '  float v = f * 0.5 + 0.5;',
      '  v = clamp((v - 0.5) * u_contrast + 0.5, 0.0, 1.0);',
      '  vec3 col = mix(u_c3, u_c1, smoothstep(0.04, 0.74, v));',
      '  col = mix(col, u_c2, smoothstep(0.72, 1.0, v));',
      '  col += u_c2 * glow;',
      '  col *= 1.0 - 0.26 * smoothstep(0.95, 2.1, length(p));',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n');

    /* ---------------- 数据 ---------------- */
    var MODES = [
      '一 · 旋涡 Vortex',
      '二 · 涟漪 Ripple',
      '三 · 烟雾 Smoke',
      '四 · 波浪 Waves',
      '五 · 万花筒 Kaleido',
      '六 · 隧道 Tunnel',
      '七 · 玫瑰窗 Rose'
    ];

    var DEFAULTS = {
      mode: 0, c1: '#1d4ed8', c2: '#ffffff', c3: '#081226',
      contrast: 1.7, spin: 0.60, speed: 0.50, scale: 1.0, warp: 0.8, pixelFac: 1200
    };

    /* 全部预设为自创命名与配色 */
    var PRESETS = [
      { name: '教堂蓝白（定版）', mode: 0, c1: '#1d4ed8', c2: '#ffffff', c3: '#081226', contrast: 3.0, spin: 0.60, speed: 0.50, scale: 1.0,  warp: 0.8, pixelFac: 2000 },
      { name: '绛红涟漪（战斗）', mode: 1, c1: '#7a0635', c2: '#d9a441', c3: '#120409', contrast: 1.8, spin: 0.30, speed: 0.70, scale: 1.1,  warp: 0.6, pixelFac: 1200 },
      { name: '深紫圣殿',         mode: 2, c1: '#5c314a', c2: '#b27170', c3: '#090610', contrast: 1.4, spin: 0.40, speed: 0.35, scale: 0.9,  warp: 1.2, pixelFac: 900 },
      { name: '玫瑰窗',           mode: 6, c1: '#8a1c4a', c2: '#f2c14e', c3: '#160a24', contrast: 2.0, spin: 0.20, speed: 0.30, scale: 1.0,  warp: 0.5, pixelFac: 1600 },
      { name: '翡翠深渊',         mode: 0, c1: '#0e7a5f', c2: '#a8f0d0', c3: '#04150f', contrast: 1.9, spin: 0.90, speed: 0.60, scale: 1.2,  warp: 0.7, pixelFac: 1100 },

      { name: '紫罗兰虚空 Violet Void', mode: 6, c1: '#6d28d9', c2: '#c4b5fd', c3: '#0b0618', contrast: 2.0, spin: 0.45, speed: 0.40, scale: 1.0,  warp: 0.9, pixelFac: 1500 },
      { name: '抹茶庭院 Matcha Garden', mode: 2, c1: '#4d7c0f', c2: '#fef9c3', c3: '#101a05', contrast: 1.4, spin: 0.30, speed: 0.35, scale: 0.9,  warp: 1.2, pixelFac: 900 },
    ];

    var SLIDERS = [
      { key: 'contrast', label: '对比度',     min: 0.2, max: 4.0,  step: 0.05, dec: 2 },
      { key: 'spin',     label: '旋转量',     min: 0,   max: 2.0,  step: 0.01, dec: 2 },
      { key: 'speed',    label: '速度',       min: 0,   max: 2.5,  step: 0.01, dec: 2 },
      { key: 'scale',    label: '图案缩放',   min: 0.4, max: 3.0,  step: 0.01, dec: 2 },
      { key: 'warp',     label: '扭曲量',     min: 0,   max: 2.0,  step: 0.01, dec: 2 },
      { key: 'pixelFac', label: '像素细腻度', min: 100, max: 2000, step: 10,   dec: 0, unit: '越大越细' }
    ];

    var STORE_KEY = 'vortex-bg-editor-v1';

    function clampNum(v, min, max, fallback) {
      v = parseFloat(v);
      if (!isFinite(v)) return fallback;
      return Math.min(max, Math.max(min, v));
    }
    function validHex(s) {
      return (typeof s === 'string') && /^#[0-9a-fA-F]{6}$/.test(s);
    }
    function sanitize(raw) {
      var out = {};
      var d = DEFAULTS;
      out.mode = Math.floor(clampNum(raw && raw.mode, 0, 6, d.mode));
      out.c1 = validHex(raw && raw.c1) ? raw.c1.toLowerCase() : d.c1;
      out.c2 = validHex(raw && raw.c2) ? raw.c2.toLowerCase() : d.c2;
      out.c3 = validHex(raw && raw.c3) ? raw.c3.toLowerCase() : d.c3;
      for (var i = 0; i < SLIDERS.length; i++) {
        var s = SLIDERS[i];
        out[s.key] = clampNum(raw && raw[s.key], s.min, s.max, d[s.key]);
      }
      return out;
    }
    function hexToRgb(hex) {
      return [
        parseInt(hex.slice(1, 3), 16) / 255,
        parseInt(hex.slice(3, 5), 16) / 255,
        parseInt(hex.slice(5, 7), 16) / 255
      ];
    }
    function pixelBlocks(pixelFac) {
      var k = (pixelFac - 100) / (2000 - 100);
      return Math.round(24 + k * (500 - 24));
    }

    var state = (function () {
      try {
        var saved = window.localStorage.getItem(STORE_KEY);

      } catch (e) { /* 存储不可用时用默认值 */ }
      return sanitize(DEFAULTS);
    })();

    var paused = false;
    var simTime = 0;

    function saveState() {
      try { window.localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    /* ---------------- DOM ---------------- */
    function $(id) { return document.getElementById(id); }
    var glCanvas = $('glCanvas'), swCanvas = $('swCanvas');
    var statusEl = $('status'), statusText = $('statusText'), fpsText = $('fpsText');
    var toastEl = $('toast'), toastTimer = null;

    function toast(msg, isErr) {
      toastEl.textContent = msg;
      toastEl.className = 'show' + (isErr ? ' err' : '');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.className = ''; }, 2600);
    }
    function setStatus(html, warn) {
      statusText.innerHTML = html;
      statusEl.className = warn ? 'warn' : '';
      statusEl.id = 'status';
    }

    /* ---------------- WebGL 路径 ---------------- */
    var gl = null, glProg = null, glU = {}, glOK = false, glError = '';

    function compileShader(type, src) {
      var sh = gl.createShader(type);
      gl.shaderSource(sh, src);
      gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
        var log = gl.getShaderInfoLog(sh) || '未知编译错误';
        gl.deleteShader(sh);
        throw new Error(log.split('\n')[0]);
      }
      return sh;
    }
    function initGL() {
      glOK = false; glError = '';
      try {
        gl = glCanvas.getContext('webgl', { preserveDrawingBuffer: true, antialias: false })
          || glCanvas.getContext('experimental-webgl', { preserveDrawingBuffer: true, antialias: false });
      } catch (e) { gl = null; }
      if (!gl) { glError = '浏览器未提供 WebGL 上下文'; return false; }
      try {
        var vs = compileShader(gl.VERTEX_SHADER, VERT_SRC);
        var fs = compileShader(gl.FRAGMENT_SHADER, FRAG_SRC);
        glProg = gl.createProgram();
        gl.attachShader(glProg, vs);
        gl.attachShader(glProg, fs);
        gl.linkProgram(glProg);
        if (!gl.getProgramParameter(glProg, gl.LINK_STATUS)) {
          throw new Error((gl.getProgramInfoLog(glProg) || '链接失败').split('\n')[0]);
        }
        gl.useProgram(glProg);
        var buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        var loc = gl.getAttribLocation(glProg, 'a_pos');
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        var names = ['u_res', 'u_time', 'u_mode', 'u_c1', 'u_c2', 'u_c3', 'u_contrast', 'u_spin', 'u_scale', 'u_warp', 'u_blocks'];
        glU = {};
        for (var i = 0; i < names.length; i++) glU[names[i]] = gl.getUniformLocation(glProg, names[i]);
      } catch (e) {
        glError = '着色器编译/链接失败：' + e.message;
        gl = null;
        return false;
      }
      glOK = true;
      return true;
    }
    function drawGL(w, h) {
      gl.viewport(0, 0, w, h);
      var c1 = hexToRgb(state.c1), c2 = hexToRgb(state.c2), c3 = hexToRgb(state.c3);
      gl.uniform2f(glU.u_res, w, h);
      gl.uniform1f(glU.u_time, simTime);
      gl.uniform1i(glU.u_mode, state.mode);
      gl.uniform3f(glU.u_c1, c1[0], c1[1], c1[2]);
      gl.uniform3f(glU.u_c2, c2[0], c2[1], c2[2]);
      gl.uniform3f(glU.u_c3, c3[0], c3[1], c3[2]);
      gl.uniform1f(glU.u_contrast, state.contrast);
      gl.uniform1f(glU.u_spin, state.spin);
      gl.uniform1f(glU.u_scale, state.scale);
      gl.uniform1f(glU.u_warp, state.warp);
      gl.uniform1f(glU.u_blocks, pixelBlocks(state.pixelFac));
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    glCanvas.addEventListener('webglcontextlost', function (e) {
      e.preventDefault();
      glOK = false;
      startFallback('WebGL 上下文丢失');

    glCanvas.addEventListener('webglcontextrestored', function () {
      if (initGL()) {

    /* ---------------- Canvas 2D 备用路径 ----------------
       与着色器同一套 field 数学的 JS 近似实现，低分辨率
       ImageData 逐格计算后放大，动画与控件照常工作。 */
    var swCtx = swCanvas.getContext('2d');
    var swOff = document.createElement('canvas');
    var swOffCtx = swOff.getContext('2d');
    var fallbackActive = false, fallbackReason = '';

    function smoothstep(a, b, x) {
      var t = Math.min(1, Math.max(0, (x - a) / (b - a)));
      return t * t * (3 - 2 * t);
    }
    function segFoldJS(a, seg) {
      var w = Math.PI * 2 / seg;
      var m = ((a % w) + w) % w;
      return Math.abs(m - w * 0.5);
    }
    function fieldJS(px, py, t) {
      var warp = state.warp;
      var qx = px + warp * 0.16 * Math.sin(py * 2.7 + t * 0.70) + warp * 0.07 * Math.sin(py * 6.1 - t * 1.05);
      var qy = py + warp * 0.16 * Math.cos(px * 2.7 - t * 0.62) + warp * 0.07 * Math.cos(px * 6.1 + t * 0.90);
      var r = Math.sqrt(qx * qx + qy * qy);
      var a = Math.atan2(qy, qx);
      var spin = state.spin, f = 0, glow = 0;
      switch (state.mode) {
        case 0:
          f = (Math.sin(3 * a + spin * 7.0 / (r + 0.50) + 2.2 * r - 1.35 * t)
             + 0.30 * Math.sin(7.0 * r - 2.0 * t)) * 0.78; break;
        case 1:
          f = (Math.sin(10.0 * r - 2.1 * t + spin * 3.0 * Math.sin(3.0 * a + t * 0.4))
             + 0.25 * Math.sin(17.0 * r - 3.1 * t)) * 0.82; break;
        case 2: {
          var s = Math.sin(qx * 1.9 + t * 0.40) + Math.sin(qy * 2.4 - t * 0.31)
                + Math.sin((qx + qy) * 1.25 + t * 0.52) + Math.sin(r * 3.2 - t * 0.60);
          f = s * 0.25;
          var breathe = 0.5 + 0.5 * Math.sin(t * 0.9);
          glow = Math.exp(-Math.sqrt(px * px + py * py) * 2.3) * (0.08 + 0.15 * breathe);
          break;
        }
        case 3:
          f = Math.sin(qx * 3.1 + 1.7 * Math.sin(qy * 2.3 + t * 0.8) + t * 1.0) * 0.72
            + Math.sin(qy * 5.2 - t * 1.35) * 0.28; break;
        case 4: {
          var aa = segFoldJS(a + spin * 1.4 / (r + 0.6), 6);
          var kx = r * Math.cos(aa), ky = r * Math.sin(aa);
          f = Math.sin(kx * 6.0 - t * 1.1) * 0.60 + Math.sin(ky * 8.0 + r * 4.0 - t * 1.5) * 0.40;
          break;
        }
        case 5: {
          var lr = Math.log(r + 0.09);
          f = Math.sin(lr * 8.5 - 2.3 * t) * 0.72 + Math.sin(a * 5.0 + spin * 3.0 + lr * 3.0) * 0.28;
          break;
        }
        default: {
          var aa7 = segFoldJS(a, 8);
          var rr = r * (0.86 + 0.26 * Math.cos(aa7 * 8.0));
          f = Math.sin(rr * 10.0 - 1.25 * t + spin * 2.0 * Math.cos(aa7 * 8.0)) * 0.62
            + Math.sin(aa7 * 24.0 + r * 3.0) * 0.20
            + Math.sin(r * 22.0 - 1.8 * t) * 0.18;
        }
      }
      return [f, glow];
    }
    function drawFallback(w, h) {
      var blocks = Math.min(pixelBlocks(state.pixelFac), 176);
      var gw = Math.max(24, blocks);
      var gh = Math.max(16, Math.round(gw * h / w));
      if (swOff.width !== gw || swOff.height !== gh) { swOff.width = gw; swOff.height = gh; }
      var img = swOffCtx.createImageData(gw, gh);
      var data = img.data;
      var c1 = hexToRgb(state.c1), c2 = hexToRgb(state.c2), c3 = hexToRgb(state.c3);
      var aspect = w / h, scale = state.scale, contrast = state.contrast;
      var idx = 0;
      for (var y = 0; y < gh; y++) {
        var py = ((y + 0.5) / gh - 0.5) * 2.0 * scale;
        for (var x = 0; x < gw; x++) {
          var px = ((x + 0.5) / gw - 0.5) * 2.0 * aspect * scale;
          var fg = fieldJS(px, py, simTime);
          var v = fg[0] * 0.5 + 0.5;
          v = Math.min(1, Math.max(0, (v - 0.5) * contrast + 0.5));
          var m1 = smoothstep(0.04, 0.74, v);
          var rr = c3[0] + (c1[0] - c3[0]) * m1;
          var gg = c3[1] + (c1[1] - c3[1]) * m1;
          var bb = c3[2] + (c1[2] - c3[2]) * m1;
          var m2 = smoothstep(0.72, 1.0, v);
          rr += (c2[0] - rr) * m2; gg += (c2[1] - gg) * m2; bb += (c2[2] - bb) * m2;
          rr += c2[0] * fg[1]; gg += c2[1] * fg[1]; bb += c2[2] * fg[1];
          var vig = 1.0 - 0.26 * smoothstep(0.95, 2.1, Math.sqrt(px * px + py * py) / scale);
          data[idx++] = Math.min(255, rr * vig * 255);
          data[idx++] = Math.min(255, gg * vig * 255);
          data[idx++] = Math.min(255, bb * vig * 255);
          data[idx++] = 255;
        }
      }
      swOffCtx.putImageData(img, 0, 0);
      swCtx.imageSmoothingEnabled = false;
      swCtx.clearRect(0, 0, w, h);
      swCtx.drawImage(swOff, 0, 0, w, h);
    }

    function useGLPath() {
      fallbackActive = false;
      glCanvas.classList.remove('hidden-canvas');
      swCanvas.classList.add('hidden-canvas');
      setStatus('<b>WebGL 渲染中</b> · ' + MODES[state.mode], false);
    }
    function startFallback(reason) {
      fallbackActive = true;
      fallbackReason = reason;
      glCanvas.classList.add('hidden-canvas');
      swCanvas.classList.remove('hidden-canvas');
      setStatus('<b>Canvas 2D 备用渲染</b> · ' + reason, true);
    }

    /* ---------------- 控件 ---------------- */
    var modeSel = $('modeSel'), presetSel = $('presetSel');
    var i, opt;
    for (i = 0; i < MODES.length; i++) {
      opt = document.createElement('option');
      opt.value = i; opt.textContent = MODES[i];
      modeSel.appendChild(opt);
    }
    for (i = 0; i < PRESETS.length; i++) {
      opt = document.createElement('option');
      opt.value = i; opt.textContent = PRESETS[i].name;
      presetSel.appendChild(opt);
    }

    var sliderEls = {};
    (function buildSliders() {
      var host = $('sliders');
      SLIDERS.forEach(function (s) {
        var wrap = document.createElement('div');
        wrap.className = 'ctl';
        var head = document.createElement('div');
        head.className = 'ctl-head';
        var lab = document.createElement('label');
        lab.textContent = s.label;
        lab.htmlFor = 'range-' + s.key;
        if (s.unit) {
          var u = document.createElement('span');
          u.className = 'unit'; u.textContent = s.unit;
          lab.appendChild(u);
        }
        head.appendChild(lab);
        var body = document.createElement('div');
        body.className = 'ctl-body';
        var range = document.createElement('input');
        range.type = 'range'; range.id = 'range-' + s.key;
        range.min = s.min; range.max = s.max; range.step = s.step;
        range.setAttribute('aria-label', s.label);
        var num = document.createElement('input');
        num.type = 'number'; num.id = 'num-' + s.key;
        num.min = s.min; num.max = s.max; num.step = s.step;
        num.setAttribute('aria-label', s.label + '数值');
        body.appendChild(range); body.appendChild(num);
        wrap.appendChild(head); wrap.appendChild(body);
        host.appendChild(wrap);
        sliderEls[s.key] = { range: range, num: num, cfg: s };

        range.addEventListener('input', function () {
          setParam(s.key, parseFloat(range.value), 'range');
        });
        num.addEventListener('change', function () {
          setParam(s.key, parseFloat(num.value), 'num');
        });
      });
    })();

    function fmtVal(cfg, v) {
      return cfg.dec === 0 ? String(Math.round(v)) : v.toFixed(cfg.dec);
    }
    function setParam(key, v, src) {
      var cfg = null;
      for (var j = 0; j < SLIDERS.length; j++) if (SLIDERS[j].key === key) cfg = SLIDERS[j];
      if (!cfg || !isFinite(v)) { syncUI(); return; }
      state[key] = Math.min(cfg.max, Math.max(cfg.min, v));
      var els = sliderEls[key];
      if (src !== 'range') els.range.value = state[key];
      if (src !== 'num') els.num.value = fmtVal(cfg, state[key]);
      markCustom();
      saveState();
    }

    var colorEls = {};
    ['c1', 'c2', 'c3'].forEach(function (key) {
      colorEls[key] = { picker: $(key), hex: $(key + 'hex') };
      colorEls[key].picker.addEventListener('input', function () {
        state[key] = colorEls[key].picker.value.toLowerCase();
        colorEls[key].hex.value = state[key];
        markCustom(); saveState();
      });
      colorEls[key].hex.addEventListener('change', function () {
        var v = colorEls[key].hex.value.trim();
        if (v.charAt(0) !== '#') v = '#' + v;
        if (validHex(v)) {
          state[key] = v.toLowerCase();
          colorEls[key].picker.value = state[key];
          colorEls[key].hex.value = state[key];
          markCustom(); saveState();
        } else {
          colorEls[key].hex.value = state[key];
          toast('颜色值格式不对，应为 #RRGGBB', true);
        }
      });
    });

    function markCustom() { presetSel.value = ''; }
    function syncUI() {
      modeSel.value = state.mode;
      for (var key in sliderEls) {
        var els = sliderEls[key];
        els.range.value = state[key];
        els.num.value = fmtVal(els.cfg, state[key]);
      }
      ['c1', 'c2', 'c3'].forEach(function (k) {
        colorEls[k].picker.value = state[k];
        colorEls[k].hex.value = state[k];
      });
    }

    modeSel.addEventListener('change', function () {
      state.mode = parseInt(modeSel.value, 10) || 0;
      markCustom(); saveState();
      if (!fallbackActive) setStatus('<b>WebGL 渲染中</b> · ' + MODES[state.mode], false);
    });
    presetSel.addEventListener('change', function () {
      if (presetSel.value === '') return;
      var p = PRESETS[parseInt(presetSel.value, 10)];
      state = sanitize(p);
      syncUI(); saveState();
      if (!fallbackActive) setStatus('<b>WebGL 渲染中</b> · ' + MODES[state.mode], false);
      toast('已应用预设「' + p.name + '」');
    });

    /* ---------------- 暂停 / 面板 ---------------- */
    var pauseBtn = $('pauseBtn');
    function setPaused(v) {
      paused = v;
      pauseBtn.textContent = paused ? '继续' : '暂停';
    }
    pauseBtn.addEventListener('click', function () { setPaused(!paused); });

    var panel = $('panel'), panelToggle = $('panelToggle');
    function setPanel(open) {
      panel.classList.toggle('hidden', !open);
      panelToggle.classList.toggle('show', !open);
    }
    $('collapseBtn').addEventListener('click', function () { setPanel(false); });
    panelToggle.addEventListener('click', function () { setPanel(true); });

    document.addEventListener('keydown', function (e) {
      var tag = (e.target && e.target.tagName) || '';
      var typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
      if (e.code === 'Space' && !typing) {
        e.preventDefault();
        setPaused(!paused);
      } else if ((e.key === 'h' || e.key === 'H') && !typing) {
        setPanel(panel.classList.contains('hidden'));
      }
    });

    /* ---------------- 导出 / 导入 ---------------- */
    var jsonBox = $('jsonBox');
    function stateJSON() {
      var o = { mode: state.mode, c1: state.c1, c2: state.c2, c3: state.c3 };
      SLIDERS.forEach(function (s) { o[s.key] = Math.round(state[s.key] * 1000) / 1000; });
      return o;
    }
    $('copyJsonBtn').addEventListener('click', function () {
      var text = JSON.stringify(stateJSON(), null, 2);
      jsonBox.value = text;
      function done() { toast('参数 JSON 已复制到剪贴板'); }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () {
          jsonBox.select();
          try { document.execCommand('copy'); done(); }
          catch (e) { toast('复制失败，JSON 已填入下方文本框，可手动复制', true); }
        });
      } else {
        jsonBox.select();
        try { document.execCommand('copy'); done(); }
        catch (e) { toast('复制失败，JSON 已填入下方文本框，可手动复制', true); }
      }
    });
    $('applyJsonBtn').addEventListener('click', function () {
      var raw;
      try { raw = JSON.parse(jsonBox.value); }
      catch (e) { toast('JSON 解析失败：' + e.message, true); return; }
      if (!raw || typeof raw !== 'object') { toast('JSON 内容不是参数对象', true); return; }
      state = sanitize(raw);
      syncUI(); markCustom(); saveState();
      if (!fallbackActive) setStatus('<b>WebGL 渲染中</b> · ' + MODES[state.mode], false);
      toast('已应用粘贴的 JSON 参数');
    });

    function download(blob, filename) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    }

    $('exportHtmlBtn').addEventListener('click', function () {
      var parts = [];
      parts.push('<!doctype html>');
      parts.push('<!--');
      parts.push('  独立旋涡背景 · 由「旋涡背景编辑器」导出');
      parts.push('  本文件中的着色器与参数均为原创实现，MIT 开源，可自由用于个人与商业项目。');
      parts.push('  MIT License — Permission is hereby granted, free of charge, to any person');
      parts.push('  obtaining a copy of this file to use, copy, modify and distribute it,');
      parts.push('  subject to inclusion of this notice.');
      parts.push('-->');
      parts.push('<html lang="zh-CN"><head><meta charset="utf-8" />');
      parts.push('<meta name="viewport" content="width=device-width, initial-scale=1" />');
      parts.push('<title>旋涡背景</title>');
      parts.push('<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>');
      parts.push('</head><body>');
      parts.push('<canvas id="bg"></canvas>');
      parts.push('<script>');
      parts.push('var PARAMS = ' + JSON.stringify(stateJSON()) + ';');
      parts.push('var VERT = ' + JSON.stringify(VERT_SRC) + ';');
      parts.push('var FRAG = ' + JSON.stringify(FRAG_SRC) + ';');
      parts.push('var canvas = document.getElementById("bg");');
      parts.push('var gl = canvas.getContext("webgl", { antialias: false });');
      parts.push('if (!gl) { document.body.innerHTML = "<p style=\\"color:#fff;font-family:sans-serif;padding:2em\\">此设备不支持 WebGL，背景无法渲染。</p>"; }');
      parts.push('else {');
      parts.push('  function sh(type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }');
      parts.push('  var prog = gl.createProgram();');
      parts.push('  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));');
      parts.push('  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));');
      parts.push('  gl.linkProgram(prog); gl.useProgram(prog);');
      parts.push('  var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);');
      parts.push('  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);');
      parts.push('  var loc = gl.getAttribLocation(prog, "a_pos"); gl.enableVertexAttribArray(loc);');
      parts.push('  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);');
      parts.push('  var U = {}; ["u_res","u_time","u_mode","u_c1","u_c2","u_c3","u_contrast","u_spin","u_scale","u_warp","u_blocks"].forEach(function(n){ U[n] = gl.getUniformLocation(prog, n); });');
      parts.push('  function rgb(h){ return [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255]; }');
      parts.push('  var C1 = rgb(PARAMS.c1), C2 = rgb(PARAMS.c2), C3 = rgb(PARAMS.c3);');
      parts.push('  var BLOCKS = Math.round(24 + (PARAMS.pixelFac - 100) / 1900 * 476);');
      parts.push('  var start = performance.now();');
      parts.push('  (function frame(now) {');
      parts.push('    var w = canvas.clientWidth, h = canvas.clientHeight;');
      parts.push('    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }');
      parts.push('    gl.viewport(0, 0, w, h);');
      parts.push('    gl.uniform2f(U.u_res, w, h);');
      parts.push('    gl.uniform1f(U.u_time, (now - start) / 1000 * PARAMS.speed);');
      parts.push('    gl.uniform1i(U.u_mode, PARAMS.mode);');
      parts.push('    gl.uniform3f(U.u_c1, C1[0], C1[1], C1[2]);');
      parts.push('    gl.uniform3f(U.u_c2, C2[0], C2[1], C2[2]);');
      parts.push('    gl.uniform3f(U.u_c3, C3[0], C3[1], C3[2]);');
      parts.push('    gl.uniform1f(U.u_contrast, PARAMS.contrast);');
      parts.push('    gl.uniform1f(U.u_spin, PARAMS.spin);');
      parts.push('    gl.uniform1f(U.u_scale, PARAMS.scale);');
      parts.push('    gl.uniform1f(U.u_warp, PARAMS.warp);');
      parts.push('    gl.uniform1f(U.u_blocks, BLOCKS);');
      parts.push('    gl.drawArrays(gl.TRIANGLES, 0, 3);');
      parts.push('    requestAnimationFrame(frame);');
      parts.push('  })(start);');
      parts.push('}');
      parts.push('<' + '/script>');
      parts.push('</body></html>');
      var html = parts.join('\n');
      download(new Blob([html], { type: 'text/html;charset=utf-8' }), 'vortex-background.html');
      toast('独立 HTML 背景已导出，可直接双击打开或嵌入网页');
    });

    $('pngBtn').addEventListener('click', function () {
      var src = fallbackActive ? swCanvas : glCanvas;
      if (!fallbackActive && glOK) drawGL(src.width, src.height); /* 捕获前重绘一帧确保画面最新 */
      if (src.toBlob) {
        src.toBlob(function (blob) {
          if (blob) { download(blob, 'vortex-bg.png'); toast('PNG 快照已导出'); }
          else toast('PNG 导出失败', true);
        }, 'image/png');
      } else {
        try {
          var a = document.createElement('a');
          a.href = src.toDataURL('image/png'); a.download = 'vortex-bg.png';
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          toast('PNG 快照已导出');
        } catch (e) { toast('PNG 导出失败：' + e.message, true); }
      }
    });

    $('randomBtn').addEventListener('click', function () {
      function rndHex() {
        var h = Math.floor(Math.random() * 0xffffff).toString(16);
        while (h.length < 6) h = '0' + h;
        return '#' + h;
      }
      function rnd(min, max) { return Math.round((min + Math.random() * (max - min)) * 100) / 100; }
      state = sanitize({
        mode: Math.floor(Math.random() * 7),
        c1: rndHex(), c2: rndHex(), c3: rndHex(),
        contrast: rnd(0.8, 3.2), spin: rnd(0, 1.6), speed: rnd(0.15, 1.6),
        scale: rnd(0.6, 2.2), warp: rnd(0, 1.8),
        pixelFac: Math.round(rnd(400, 2000) / 10) * 10
      });
      syncUI(); markCustom(); saveState();
      if (!fallbackActive) setStatus('<b>WebGL 渲染中</b> · ' + MODES[state.mode], false);
      toast('已随机生成一组参数');
    });

    $('resetBtn').addEventListener('click', function () {
      state = sanitize(DEFAULTS);
      syncUI(); markCustom(); saveState();
      setPaused(false);
      if (!fallbackActive) setStatus('<b>WebGL 渲染中</b> · ' + MODES[state.mode], false);
      toast('已恢复默认参数');
    });

    /* ---------------- 尺寸与主循环 ---------------- */
    function fitCanvas(cv) {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var w = Math.max(2, Math.round(window.innerWidth * dpr));
      var h = Math.max(2, Math.round(window.innerHeight * dpr));
      if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
      return [w, h];
    }
    var lastTs = 0, fpsCount = 0, fpsLast = performance.now();
    function frame(ts) {
      requestAnimationFrame(frame);
      var dt = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0.016;
      lastTs = ts;
      if (!paused) simTime += dt * state.speed;
      if (fallbackActive) {
        var s = fitCanvas(swCanvas);
        drawFallback(s[0], s[1]);
      } else if (glOK) {
        var g = fitCanvas(glCanvas);
        drawGL(g[0], g[1]);
      }
      fpsCount++;
      if (ts - fpsLast >= 600) {
        var fps = Math.round(fpsCount * 1000 / (ts - fpsLast));
        fpsText.textContent = fps + ' fps';
        fpsCount = 0; fpsLast = ts;
      }
    }

    /* ---------------- 启动 ---------------- */
    syncUI();
    if (initGL()) {
      useGLPath();
    } else {
      startFallback(glError || 'WebGL 不可用');
    }
    requestAnimationFrame(frame);
    </script>
  </body>
</html>
